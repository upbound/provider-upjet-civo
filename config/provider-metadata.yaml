name: civo/civo
resources:
    civo_database:
        subCategory: Civo Database
        name: civo_database
        title: civo_database Resource - terraform-provider-civo
        examples:
            - name: custom_database
              manifest: |-
                {
                  "engine": "${element(data.civo_database_version.mysql.versions, 0).engine}",
                  "name": "custom_database",
                  "nodes": 2,
                  "size": "${element(data.civo_size.small.sizes, 0).name}",
                  "version": "${element(data.civo_database_version.mysql.versions, 0).version}"
                }
        argumentDocs:
            create: (String)
            delete: (String)
            dns_endpoint: (String) The DNS endpoint of the database
            endpoint: (String) The endpoint of the database
            engine: (String) The engine of the database
            firewall_id: (String) The ID of the firewall to use, from the current list. If left blank or not sent, the default firewall will be used (open to all)
            id: (String) The ID of this resource.
            name: (String) Name of the database
            network_id: (String) The id of the associated network
            nodes: (Number) Count of nodes
            password: (String) The password of the database
            port: (Number) The port of the database
            private_ipv4: (String) The private IP assigned to the database
            region: (String) The region where the database will be created.
            size: (String) Size of the database
            status: (String) The status of the database
            timeouts: (Block, Optional) (see below for nested schema)
            update: (String)
            username: (String) The username of the database
            version: (String) The version of the database
        importStatements:
            - |-
              # using ID
              terraform import civo_database.mydb 29fcd1c4-fb61-44c7-b49c-dc7b98e9927e
    civo_dns_domain_name:
        subCategory: Civo Network
        description: Provides a Civo DNS domain name resource.
        name: civo_dns_domain_name
        title: civo_dns_domain_name Resource - terraform-provider-civo
        examples:
            - name: main
              manifest: |-
                {
                  "name": "mydomain.com"
                }
        argumentDocs:
            account_id: (String) The account ID of the domain
            id: (String) The ID of this resource.
            name: (String) The name of the domain
        importStatements:
            - |-
              # using domain name
              terraform import civo_dns_domain_name.main mydomain.com
    civo_dns_domain_record:
        subCategory: Civo Network
        description: Provides a Civo DNS domain record resource.
        name: civo_dns_domain_record
        title: civo_dns_domain_record Resource - terraform-provider-civo
        examples:
            - name: www
              manifest: |-
                {
                  "depends_on": [
                    "${civo_dns_domain_name.mydomain}",
                    "${civo_instance.foo}"
                  ],
                  "domain_id": "${civo_dns_domain_name.mydomain.id}",
                  "name": "www",
                  "ttl": 600,
                  "type": "A",
                  "value": "${civo_instance.foo.public_ip}"
                }
              references:
                domain_id: civo_dns_domain_name.mydomain.id
                value: civo_instance.foo.public_ip
              dependencies:
                civo_dns_domain_name.mydomain: |-
                    {
                      "name": "mydomain.com"
                    }
                civo_instance.foo: |-
                    {
                      "disk_image": "${element(data.civo_disk_image.debian.diskimages, 0).id}",
                      "hostname": "foo.com",
                      "size": "${element(data.civo_instances_size.small.sizes, 0).name}"
                    }
        argumentDocs:
            account_id: (String) The account ID of this resource
            created_at: (String) Timestamp when this resource was created
            domain_id: (String) ID from domain name
            id: (String) The ID of this resource.
            name: (String) The portion before the domain name (e.g. www) or an @ for the apex/root domain (you cannot use an A record with an amex/root domain)
            priority: (Number) Useful for MX records only, the priority mail should be attempted it (defaults to 10)
            ttl: (Number) How long caching DNS servers should cache this record for, in seconds (the minimum is 60 and the default if unspecified is 600)
            type: (String) The choice of RR type from a, cname, mx or txt
            updated_at: (String) Timestamp when this resource was updated
            value: (String) The IP address (A or MX), hostname (CNAME or MX) or text value (TXT) to serve for this record
        importStatements:
            - |-
              # using domain_id:domain_record_id
              terraform import civo_dns_domain_record.www a3cd6832-9577-4017-afd7-17d239fc0bf0:c9a39d14-ee1b-4870-8fb0-a2d4f465e822
    civo_firewall:
        subCategory: Civo Network
        description: Provides a Civo firewall resource. This can be used to create, modify, and delete firewalls.
        name: civo_firewall
        title: civo_firewall Resource - terraform-provider-civo
        examples:
            - name: example
              manifest: |-
                {
                  "create_default_rules": false,
                  "egress_rule": [
                    {
                      "action": "allow",
                      "cidr": [
                        "0.0.0.0/0"
                      ],
                      "label": "all",
                      "port_range": "1-65535",
                      "protocol": "tcp"
                    }
                  ],
                  "ingress_rule": [
                    {
                      "action": "allow",
                      "cidr": [
                        "0.0.0.0"
                      ],
                      "label": "http",
                      "port_range": "80",
                      "protocol": "tcp"
                    },
                    {
                      "action": "allow",
                      "cidr": [
                        "0.0.0.0"
                      ],
                      "label": "https",
                      "port_range": "443",
                      "protocol": "tcp"
                    },
                    {
                      "action": "allow",
                      "cidr": [
                        "192.168.1.1/32",
                        "192.168.10.4/32",
                        "192.168.10.10/32"
                      ],
                      "label": "ssh",
                      "port_range": "22",
                      "protocol": "tcp"
                    }
                  ],
                  "name": "example-firewall",
                  "network_id": "${civo_network.example.id}"
                }
              references:
                network_id: civo_network.example.id
              dependencies:
                civo_instance.example: |-
                    {
                      "disk_image": "${data.civo_disk_image.debian.diskimages[0].id}",
                      "firewall_id": "${civo_firewall.example.id}",
                      "hostname": "example",
                      "network_id": "${civo_network.example.id}",
                      "notes": "This is an example instance",
                      "size": "g3.xsmall"
                    }
                civo_network.example: |-
                    {
                      "label": "example-network"
                    }
            - name: example
              manifest: |-
                {
                  "name": "example-firewall",
                  "network_id": "${civo_network.example.id}"
                }
              references:
                network_id: civo_network.example.id
        argumentDocs:
            action: (String) The action of the rule can be allow or deny. When we set the action = 'allow', this is going to add a rule to allow traffic. Similarly, setting action = 'deny' will deny the traffic.
            cidr: (Set of String) The CIDR notation of the other end to affect, or a valid network CIDR (e.g. 0.0.0.0/0 to open for everyone or 1.2.3.4/32 to open just for a specific IP address)
            create_default_rules: '(Boolean) The create rules flag is used to create the default firewall rules, if is not defined will be set to true. If you set it to false you need to define at least one ingress or egress rule, and it needs to be false when custom rules are declared at creation time. This flag only takes effect when the firewall is created: changing it on an existing firewall is applied in-place (the firewall is never recreated). Changing it to false requires declaring at least one ingress_rule or egress_rule to replace the default rules; changing it back to true is a no-op and does not re-create the default rules.'
            egress_rule: (Block Set) The egress rules, this is a list of rules that will be applied to the firewall (see below for nested schema)
            id: (String) The ID of the firewall rule. This is only set when the rule is created by terraform.
            ingress_rule: (Block Set) The ingress rules, this is a list of rules that will be applied to the firewall (see below for nested schema)
            label: (String) A string that will be the displayed name/reference for this rule
            name: (String) The firewall name
            network_id: (String) The firewall network, if is not defined we use the default network
            port_range: (String) The port or port range to open, can be a single port or a range separated by a dash (-), e.g. 80 or 80-443
            protocol: (String) The protocol choice from tcp, udp or icmp (the default if unspecified is tcp)
            region: (String) The firewall region, if is not defined we use the global defined in the provider
        importStatements:
            - |-
              # using ID
              terraform import civo_firewall.www b8ecd2ab-2267-4a5e-8692-cbf1d32583e3
    civo_instance:
        subCategory: Civo Instance
        description: Provides a Civo instance resource. This can be used to create, modify, and delete instances.
        name: civo_instance
        title: civo_instance Resource - terraform-provider-civo
        examples:
            - name: example
              manifest: |-
                {
                  "disk_image": "${data.civo_disk_image.debian.diskimages[0].id}",
                  "firewall_id": "${civo_firewall.example.id}",
                  "hostname": "example",
                  "network_id": "${civo_network.example.id}",
                  "notes": "This is an example instance",
                  "size": "g3.xsmall",
                  "tags": [
                    "example",
                    "documentation"
                  ]
                }
              references:
                disk_image: data.civo_disk_image.debian.diskimages[0].id
                firewall_id: civo_firewall.example.id
                network_id: civo_network.example.id
              dependencies:
                civo_firewall.example: |-
                    {
                      "create_default_rules": true,
                      "name": "example-firewall",
                      "network_id": "${civo_network.example.id}"
                    }
                civo_network.example: |-
                    {
                      "label": "example-network"
                    }
            - name: example
              manifest: |-
                {
                  "disk_image": "${data.civo_disk_image.debian.diskimages[0].id}",
                  "firewall_id": "${civo_firewall.example.id}",
                  "hostname": "example",
                  "network_id": "${civo_network.example.id}",
                  "notes": "This is an example instance",
                  "size": "g3.xsmall",
                  "sshkey_id": "${civo_ssh_key.example.id}",
                  "tags": [
                    "example",
                    "documentation"
                  ],
                  "volume_type": "csi-s3"
                }
              references:
                disk_image: data.civo_disk_image.debian.diskimages[0].id
                firewall_id: civo_firewall.example.id
                network_id: civo_network.example.id
                sshkey_id: civo_ssh_key.example.id
              dependencies:
                civo_firewall.example: |-
                    {
                      "create_default_rules": true,
                      "name": "example-firewall",
                      "network_id": "${civo_network.example.id}"
                    }
                civo_network.example: |-
                    {
                      "label": "example-network"
                    }
                civo_ssh_key.example: |-
                    {
                      "name": "example",
                      "public_key": "${file(\"~/.ssh/example-tf.pub\")}"
                    }
        argumentDocs:
            cpu_cores: (Number) Instance's CPU cores
            create: (String) sets timeout for cluster creation - default 30 minutes
            created_at: (String) Timestamp when the instance was created
            disk_gb: (Number) Instance's disk (GB)
            disk_image: (String) The ID for the disk image to use to build the instance
            firewall_id: (String) The ID of the firewall to use, from the current list. If left blank or not sent, the default firewall will be used (open to all)
            hostname: (String) A fully qualified domain name that should be set as the instance's hostname
            id: (String) The ID of this resource.
            initial_password: (String, Sensitive) Initial password for login
            initial_user: (String) The name of the initial user created on the server (optional; this will default to the template's default_username and fallback to civo)
            network_id: (String) This must be the ID of the network from the network listing (optional; default network used when not specified)
            notes: (String) Add some notes to the instance
            private_ip: (String) Instance's private IP address
            private_ipv4: (String) The private IPv4 address for the instance (optional)
            public_ip: (String) Instance's public IP address
            public_ip_required: '(String) This should be either ''none'' or ''create'' (default: ''create'')'
            ram_mb: (Number) Instance's RAM (MB)
            region: (String) The region for the instance, if not declare we use the region in declared in the provider
            reserved_ipv4: (String) Can be either the UUID, name, or the IP address of the reserved IP
            reverse_dns: (String) A fully qualified domain name that should be used as the instance's IP's reverse DNS (optional, uses the hostname if unspecified)
            script: '(String) The contents of a script that will be uploaded to /usr/local/bin/civo-user-init-script on your instance, read/write/executable only by root and then will be executed at the end of the cloud initialization. To fetch from file: file("${path.module}/script") (this is an immutable field, meaning you can''t change it after creation)'
            size: (String) The name of the size, from the current list, e.g. g3.xsmall
            source_id: (String) Instance's source ID
            source_type: (String) Instance's source type
            sshkey_id: (String) The ID of an already uploaded SSH public key to use for login to the default user (optional; if one isn't provided a random password will be set and returned in the initial_password field)
            status: (String) Instance's status
            tags: (Set of String) An optional list of tags, represented as a key, value pair
            timeouts: (Block, Optional) (see below for nested schema) defines timeouts for cluster creation, read and update, default is 30 minutes for all
            volume_type: '(string) Type of volume that instance should be created with, e.g: ms-xfs-2-replicas, px-csi-db (default: csi-s3)'
            write_password: '(Boolean) If set to true then initial_password for the instance will be saved to terraform state file. (default: false)'
        importStatements:
            - |-
              # using ID
              terraform import civo_instance.example 18bd98ad-1b6e-4f87-b48f-e690b4fd7413
    civo_instance_reserved_ip_assignment:
        subCategory: Civo Instance
        description: The instance reserved ip assignment resource schema definition
        name: civo_instance_reserved_ip_assignment
        title: civo_instance_reserved_ip_assignment Resource - terraform-provider-civo
        examples:
            - name: webserver-www
              manifest: |-
                {
                  "instance_id": "${civo_instance.www.id}",
                  "reserved_ip_id": "${civo_reserved_ip.web-server.id}"
                }
              references:
                instance_id: civo_instance.www.id
                reserved_ip_id: civo_reserved_ip.web-server.id
              dependencies:
                civo_reserved_ip.www: |-
                    {
                      "name": "nginx-www"
                    }
        argumentDocs:
            create: (String)
            id: (String) The ID of this resource.
            instance_id: (String) The instance id
            region: (String) The region of the ip
            reserved_ip_id: (String) The reserved ip id
            timeouts: (Block, Optional) (see below for nested schema)
        importStatements: []
    civo_kubernetes_cluster:
        subCategory: Civo Kubernetes
        description: Provides a Civo Kubernetes cluster resource. This can be used to create, delete, and modify clusters.
        name: civo_kubernetes_cluster
        title: civo_kubernetes_cluster Resource - terraform-provider-civo
        examples:
            - name: example
              manifest: |-
                {
                  "firewall_id": "${data.civo_firewall.example.id}",
                  "pools": [
                    {
                      "node_count": 3,
                      "size": "g4s.kube.xsmall"
                    }
                  ]
                }
              references:
                firewall_id: data.civo_firewall.example.id
            - name: example
              manifest: |-
                {
                  "applications": "argocd,linkerd:Linkerd with Dashboard \u0026 Jaeger",
                  "cluster_type": "talos",
                  "firewall_id": "${civo_firewall.example.id}",
                  "name": "example-cluster",
                  "network_id": "${civo_network.example.id}",
                  "pools": [
                    {
                      "label": "shop",
                      "node_count": 3,
                      "size": "g4s.kube.small"
                    }
                  ]
                }
              references:
                firewall_id: civo_firewall.example.id
                network_id: civo_network.example.id
              dependencies:
                civo_firewall.example: |-
                    {
                      "create_default_rules": true,
                      "name": "example-firewall",
                      "network_id": "${civo_network.example.id}"
                    }
                civo_network.example: |-
                    {
                      "label": "example-network"
                    }
            - name: example
              manifest: |-
                {
                  "firewall_id": "${civo_firewall.example.id}",
                  "kubernetes_version": "1.28.7-k3s1",
                  "name": "example-cluster",
                  "network_id": "${civo_network.example.id}",
                  "pools": [
                    {
                      "label": "shop",
                      "node_count": 3,
                      "size": "g4s.kube.medium"
                    }
                  ],
                  "write_kubeconfig": true
                }
              references:
                firewall_id: civo_firewall.example.id
                network_id: civo_network.example.id
              dependencies:
                civo_firewall.example: |-
                    {
                      "create_default_rules": true,
                      "name": "example-firewall",
                      "network_id": "${civo_network.example.id}"
                    }
                civo_network.example: |-
                    {
                      "label": "example-network"
                    }
                kubernetes_namespace.example: |-
                    {
                      "depends_on": [
                        "${local_file.kubeconfig}"
                      ],
                      "metadata": [
                        {
                          "name": "example-namespace"
                        }
                      ]
                    }
                local_file.kubeconfig: |-
                    {
                      "content": "${civo_kubernetes_cluster.example.kubeconfig}",
                      "filename": "/tmp/${civo_kubernetes_cluster.example.name}-kubeconfig"
                    }
        argumentDocs:
            api_endpoint: (String) The API server endpoint of the cluster
            application: (String) name of the application
            applications: '(String) Comma separated list of applications to install. Spaces within application names are fine, but shouldn''t be either side of the comma. Application names are case-sensitive; the available applications can be listed with the Civo CLI: ''civo kubernetes applications ls''. If you want to remove a default installed application, prefix it with a ''-'', e.g. -Traefik. For application that supports plans, you can use ''app_name:app_plan'' format e.g. ''Linkerd:Linkerd & Jaeger'' or ''MariaDB:5GB''. View list of apps on the Civo CLI --> civo kubernetes apps ls'
            category: (String) category of the application
            cluster_type: (String) The type of cluster to create, valid options are k3s or talos the default is k3s
            cni: (String) The cni for the k3s to install (the default is flannel) valid options are cilium or flannel
            create: (String) sets timeout for cluster creation - default 30 minutes
            created_at: (String) The timestamp when the cluster was created
            delete: (String) sets timeout for cluster deletion - default 30 minutes
            dns_entry: (String) The DNS name of the cluster
            effect: (String)
            firewall_id: (String) The existing firewall ID to use for this cluster
            id: (String) The ID of this resource.
            installed: (Boolean) whether application is installed or not
            installed_applications: (List of Object) (see below for nested schema)
            instance_names: (List of String) Instance names in the nodepool
            key: (String)
            kubeconfig: (String, Sensitive) The kubeconfig of the cluster
            kubernetes_version: (String) The version of k3s to install (optional, the default is currently the latest stable available)
            label: (String) Node pool label, if you don't provide one, we will generate one for you
            labels: (Map of String)
            master_ip: (String) The IP address of the master node
            name: (String) Name for your cluster, must be unique within your account
            network_id: (String) The network for the cluster, if not declare we use the default one
            node_count: (Number) Number of nodes in the nodepool
            num_target_nodes: (Number, Deprecated) The number of instances to create (optional, the default at the time of writing is 3)
            pools: '(Block List, Min: 1, Max: 1) (see below for nested schema)'
            public_ip_node_pool: (Boolean) Node pool belongs to the public ip node pool
            ready: (Boolean) When cluster is ready, this will return true
            region: (String) The region for the cluster, if not declare we use the region in declared in the provider
            size: (String) Size of the nodes in the nodepool. View node sizes on the Civo CLI --> civo kubernetes size
            status: (String) Status of the cluster
            tags: (String) Space separated list of tags, to be used freely as required
            taint: (Block Set) (see below for nested schema)
            target_nodes_size: (String, Deprecated) The size of each node (optional, the default is currently g4s.kube.medium)
            timeouts: (Block, Optional) (see below for nested schema) defines timeouts for cluster creation, read and update, default is 30 minutes for all
            update: (String) sets timeout for cluster update - default 30 minutes
            value: (String)
            version: (String) version of the application
            write_kubeconfig: (Boolean) (false by default) when set to true, kubeconfig is saved to the terraform state file
        importStatements:
            - |-
              # using ID
              terraform import civo_kubernetes_cluster.my-cluster 1b8b2100-0e9f-4e8f-ad78-9eb578c2a0af
    civo_kubernetes_node_pool:
        subCategory: Civo Kubernetes
        description: Provides a Civo Kubernetes node pool resource. While the default node pool must be defined in the civo_kubernetes_cluster resource, this resource can be used to add additional ones to a cluster.
        name: civo_kubernetes_node_pool
        title: civo_kubernetes_node_pool Resource - terraform-provider-civo
        examples:
            - name: back-end
              manifest: |-
                {
                  "cluster_id": "${civo_kubernetes_cluster.my-cluster.id}",
                  "label": "back-end",
                  "node_count": 1,
                  "region": "LON1",
                  "size": "${element(data.civo_size.xsmall.sizes, 0).name}"
                }
              references:
                cluster_id: civo_kubernetes_cluster.my-cluster.id
              dependencies:
                civo_kubernetes_cluster.my-cluster: |-
                    {
                      "applications": "Portainer,Linkerd:Linkerd \u0026 Jaeger",
                      "firewall_id": "${civo_firewall.my-firewall.id}",
                      "name": "my-cluster",
                      "pools": [
                        {
                          "node_count": 3,
                          "size": "${element(data.civo_size.xsmall.sizes, 0).name}"
                        }
                      ]
                    }
            - name: back-end
              manifest: |-
                {
                  "cluster_id": "${civo_kubernetes_cluster.my-cluster.id}",
                  "label": "back-end",
                  "labels": {
                    "priority": "high",
                    "service": "backend"
                  },
                  "node_count": 1,
                  "region": "LON1",
                  "size": "${element(data.civo_size.xsmall.sizes, 0).name}",
                  "taint": [
                    {
                      "effect": "NoSchedule",
                      "key": "workloadKind",
                      "value": "database"
                    },
                    {
                      "effect": "NoSchedule",
                      "key": "workloadKind",
                      "value": "frontend"
                    }
                  ]
                }
              references:
                cluster_id: civo_kubernetes_cluster.my-cluster.id
              dependencies:
                civo_kubernetes_cluster.my-cluster: |-
                    {
                      "applications": "Portainer,Linkerd:Linkerd \u0026 Jaeger",
                      "firewall_id": "${civo_firewall.my-firewall.id}",
                      "name": "my-cluster",
                      "pools": [
                        {
                          "node_count": 3,
                          "size": "${element(data.civo_size.xsmall.sizes, 0).name}"
                        }
                      ]
                    }
        argumentDocs:
            cluster_id: (String) The ID of your cluster
            create: (String)
            delete: (String)
            effect: (String)
            id: (String) The ID of this resource.
            instance_names: (List of String) Instance names in the nodepool
            key: (String)
            label: (String) Node pool label, if you don't provide one, we will generate one for you
            labels: (Map of String)
            node_count: (Number) Number of nodes in the nodepool
            public_ip_node_pool: (Boolean) Node pool belongs to the public ip node pool
            size: (String) Size of the nodes in the nodepool
            taint: (Block Set) (see below for nested schema)
            timeouts: (Block, Optional) (see below for nested schema)
            update: (String)
            value: (String)
        importStatements:
            - terraform import civo_kubernetes_node_pool.my-pool 1b8b2100-0e9f-4e8f-ad78-9eb578c2a0af:502c1130-cb9b-4a88-b6d2-307bd96d946a
            - kubectl taint nodes node-1 key=value:NoSchedule-
    civo_network:
        subCategory: Civo Network
        description: Provides a Civo network resource. This can be used to create, modify, and delete networks.
        name: civo_network
        title: civo_network Resource - terraform-provider-civo
        examples:
            - name: custom_net
              manifest: |-
                {
                  "label": "test_network"
                }
        argumentDocs:
            cidr_v4: (String) The CIDR block for the network
            default: (Boolean) If the network is default, this will be true
            id: (String) The ID of this resource.
            label: (String) Name for the network
            name: (String) The name of the network
            nameservers_v4: (List of String) List of nameservers for the network
            region: (String) The region of the network
            vlan_allocation_pool_v4_end: (String) End of the IPv4 allocation pool for VLAN
            vlan_allocation_pool_v4_start: (String) Start of the IPv4 allocation pool for VLAN
            vlan_cidr_v4: (String) CIDR for VLAN IPv4
            vlan_gateway_ip_v4: (String) Gateway IP for VLAN IPv4
            vlan_id: (Number) VLAN ID for the network
            vlan_physical_interface: (String) Physical interface for VLAN
        importStatements:
