apiVersion: storage.civo.m.upbound.io/v1beta1
kind: VolumeAttachment
metadata:
  annotations:
    meta.upbound.io/example-id: storage/v1beta1/volumeattachment
  labels:
    testing.upbound.io/example-name: example-volumeattachment
  name: example-volumeattachment
  namespace: upbound-system
spec:
  forProvider:
    region: ${data.civo_default_region}
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-volumeattachment
    volumeIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-volumeattachment

---

apiVersion: storage.civo.m.upbound.io/v1beta1
kind: Volume
metadata:
  annotations:
    meta.upbound.io/example-id: storage/v1beta1/volumeattachment
  labels:
    testing.upbound.io/example-name: example-volumeattachment
  name: example-volumeattachment
  namespace: upbound-system
spec:
  forProvider:
    name: example-volumeattachment
    sizeGb: 5
    region: ${data.civo_default_region}
    networkIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-volumeattachment

---

apiVersion: compute.civo.m.upbound.io/v1beta1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: storage/v1beta1/volumeattachment
  labels:
    testing.upbound.io/example-name: example-volumeattachment
  name: example-volumeattachment
  namespace: upbound-system
spec:
  forProvider:
    hostname: example-volumeattachment
    size: g4s.xsmall
    diskImage: ${data.civo_disk_image_id}
    region: ${data.civo_default_region}
    networkIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-volumeattachment
    firewallIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-volumeattachment

---

apiVersion: vpc.civo.m.upbound.io/v1beta1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: storage/v1beta1/volumeattachment
  labels:
    testing.upbound.io/example-name: example-volumeattachment
  name: example-volumeattachment
  namespace: upbound-system
spec:
  forProvider:
    label: example-volumeattachment
    region: ${data.civo_default_region}

---

apiVersion: vpc.civo.m.upbound.io/v1beta1
kind: Firewall
metadata:
  annotations:
    meta.upbound.io/example-id: storage/v1beta1/volumeattachment
  labels:
    testing.upbound.io/example-name: example-volumeattachment
  name: example-volumeattachment
  namespace: upbound-system
spec:
  forProvider:
    name: example-volumeattachment
    region: ${data.civo_default_region}
    networkIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-volumeattachment
    createDefaultRules: true
