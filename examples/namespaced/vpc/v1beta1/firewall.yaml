apiVersion: vpc.civo.m.upbound.io/v1beta1
kind: Firewall
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1beta1/firewall
  labels:
    testing.upbound.io/example-name: example-firewall
  name: example-firewall
  namespace: upbound-system
spec:
  forProvider:
    name: example-firewall
    region: ${data.civo_default_region}
    networkIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-firewall
    createDefaultRules: false
    ingressRule:
      - label: http
        action: allow
        protocol: tcp
        portRange: "80"
        cidr:
          - 0.0.0.0/0
      - label: https
        action: allow
        protocol: tcp
        portRange: "443"
        cidr:
          - 0.0.0.0/0
    egressRule:
      - label: all
        action: allow
        protocol: tcp
        portRange: 1-65535
        cidr:
          - 0.0.0.0/0

---

apiVersion: vpc.civo.m.upbound.io/v1beta1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1beta1/firewall
  labels:
    testing.upbound.io/example-name: example-firewall
  name: example-firewall
  namespace: upbound-system
spec:
  forProvider:
    label: example-firewall
    region: ${data.civo_default_region}
