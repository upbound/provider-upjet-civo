apiVersion: civo.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  # apiEndpoint overrides the Civo API base URL; leave it unset for the public
  # Civo cloud (https://api.civo.com).
  # apiEndpoint: https://api.civo.com
  credentials:
    source: Secret
    secretRef:
      name: civo-creds
      namespace: upbound-system
      key: creds
