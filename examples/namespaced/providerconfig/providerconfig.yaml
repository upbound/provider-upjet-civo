apiVersion: civo.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: upbound-system
spec:
  # apiEndpoint overrides the Civo API base URL; leave it unset for the public
  # Civo cloud (https://api.civo.com).
  # apiEndpoint: https://api.civo.com
  credentials:
    source: Secret
    # The secret reference is namespace-local: it resolves to the namespace of
    # the referencing managed resource.
    secretRef:
      name: civo-creds
      key: creds
