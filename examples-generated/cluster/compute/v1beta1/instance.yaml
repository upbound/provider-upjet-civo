apiVersion: compute.civo.upbound.io/v1beta1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1beta1/instance
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    diskImage: ${data.civo_disk_image.debian.diskimages[0].id}
    firewallIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    hostname: example
    networkIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    notes: This is an example instance
    size: g3.xsmall
    tags:
    - example
    - documentation
