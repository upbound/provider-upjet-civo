apiVersion: dns.civo.m.upbound.io/v1beta1
kind: Record
metadata:
  annotations:
    meta.upbound.io/example-id: dns/v1beta1/record
  labels:
    testing.upbound.io/example-name: www
  name: www
  namespace: upbound-system
spec:
  forProvider:
    domainIdSelector:
      matchLabels:
        testing.upbound.io/example-name: mydomain
    name: www
    ttl: 600
    type: A
    value: ${civo_instance.foo.public_ip}

---

apiVersion: dns.civo.m.upbound.io/v1beta1
kind: Domain
metadata:
  annotations:
    meta.upbound.io/example-id: dns/v1beta1/record
  labels:
    testing.upbound.io/example-name: mydomain
  name: mydomain
  namespace: upbound-system
spec:
  forProvider:
    name: mydomain.com
